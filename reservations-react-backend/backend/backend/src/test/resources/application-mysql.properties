# Activated only by MysqlConfigurationIntegrationTest when RUN_MYSQL_TESTS=true.
spring.datasource.url=${MYSQL_TEST_URL:jdbc:mysql://localhost:3306/reservations_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris}
spring.datasource.username=${MYSQL_TEST_USERNAME:reservations}
spring.datasource.password=${MYSQL_TEST_PASSWORD:reservations}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
